
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Page Not Found | Airbnb</title>

    <script src="https://cdn.tailwindcss.com"></script>
</head>

<body class="flex min-h-screen flex-col bg-white font-sans text-[#222]">

    <!-- Header -->
    <header class="border-b border-[#eee] px-[7%] py-6">
        <a href="/" class="text-[30px] font-bold text-[#ff385c] no-underline">
            ⌂ airbnb
        </a>
    </header>

    <!-- Main Content -->
    <main class="flex flex-1 items-center justify-center px-5 py-[50px]">

        <div class="flex w-full max-w-[850px] items-center justify-between gap-[45px] max-[650px]:flex-col-reverse max-[650px]:gap-[25px] max-[650px]:text-center">

            <!-- Error Message -->
            <div class="flex-1">

                <div class="mb-[22px] text-[100px] font-bold leading-none text-[#ff385c] max-[650px]:text-[75px]">
                    404
                </div>

                <h1 class="mb-4 text-[32px] font-bold max-[650px]:text-[27px]">
                    Oops! Lost your way?
                </h1>

                <p class="mb-7 text-[17px] leading-[1.7] text-[#717171]">
                    We can't seem to find the page you're looking for.
                    It might have been moved, deleted, or the link
                    may be incorrect. Don't worry, your next adventure
                    is just one click away.
                </p>

                <a
                    href="/"
                    class="inline-block rounded-[9px] bg-[#ff385c] px-[25px] py-[15px] text-base font-bold text-white no-underline transition-colors duration-200 hover:bg-[#e31c5f]"
                >
                    Return to homepage
                </a>

            </div>

            <!-- Illustration -->
            <div class="flex-1 text-center">

                <img
                    src="https://images.unsplash.com/photo-1499793983690-e29da59ef1c2?auto=format&fit=crop&w=700&q=80"
                    alt="Beautiful holiday home by the sea"
                    class="mx-auto w-full max-w-[350px] rounded-2xl object-cover max-[650px]:max-w-[220px]"
                >

            </div>

        </div>
    </main>

    <!-- Footer -->
    <footer class="border-t border-[#eee] bg-[#f7f7f7] px-[7%] py-[25px] text-center text-sm text-[#717171]">
        © 2026 Airbnb-style Home Booking Project · Help · Privacy · Terms
    </footer>

</body>
</html>
