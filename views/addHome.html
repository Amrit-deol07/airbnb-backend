
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Airbnb | Add Your Home</title>

    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: Arial, sans-serif;
            background: #f7f7f7;
            color: #222;
        }

        header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 22px 7%;
            background: white;
            border-bottom: 1px solid #ddd;
        }

        .logo {
            color: #ff385c;
            font-size: 28px;
            font-weight: bold;
        }

        header a {
            text-decoration: none;
            color: #222;
            font-weight: bold;
        }

        .container {
            max-width: 750px;
            margin: 45px auto;
            padding: 0 20px;
        }

        h1 {
            font-size: 34px;
            margin-bottom: 10px;
        }

        .subtitle {
            color: #717171;
            margin-bottom: 28px;
            line-height: 1.5;
        }

        .form-card {
            background: white;
            padding: 32px;
            border: 1px solid #ddd;
            border-radius: 16px;
        }

        .form-group {
            margin-bottom: 22px;
        }

        label {
            display: block;
            font-weight: bold;
            margin-bottom: 9px;
        }

        input, textarea {
            width: 100%;
            padding: 14px;
            border: 1px solid #b0b0b0;
            border-radius: 9px;
            font-size: 15px;
            outline-color: #ff385c;
        }

        textarea {
            min-height: 120px;
            resize: vertical;
        }

        input:focus, textarea:focus {
            border-color: #ff385c;
        }

        .submit-btn {
            width: 100%;
            padding: 16px;
            background: #ff385c;
            color: white;
            border: none;
            border-radius: 10px;
            font-size: 17px;
            font-weight: bold;
            cursor: pointer;
        }

        .submit-btn:hover {
            background: #e31c5f;
        }

        .note {
            color: #717171;
            font-size: 13px;
            margin-top: 15px;
            line-height: 1.5;
        }

        footer {
            text-align: center;
            padding: 25px;
            color: #717171;
        }

        @media (max-width: 600px) {
            .container {
                margin: 25px auto;
            }

            .form-card {
                padding: 22px;
            }

            h1 {
                font-size: 28px;
            }
        }
    </style>
</head>

<body>

    <header>
        <div class="logo">⌂ airbnb</div>
        <a href="/">Home</a>
    </header>

    <main class="container">
        <h1>List your home</h1>

        <p class="subtitle">
            Share your space with guests and start hosting.
            Add your property details below.
        </p>

        <div class="form-card">

            <form action="/host/add-home" method="POST">

                <div class="form-group">
                    <label for="title">Property title</label>
                    <input
                        type="text"
                        id="title"
                        name="title"
                        placeholder="e.g. Beautiful villa near the beach"
                        required
                    >
                </div>

                <div class="form-group">
                    <label for="description">Description</label>
                    <textarea
                        id="description"
                        name="description"
                        placeholder="Describe your home, facilities and nearby attractions..."
                        required
                    ></textarea>
                </div>

                <div class="form-group">
                    <label for="price">Price per night (₹)</label>
                    <input
                        type="number"
                        id="price"
                        name="price"
                        placeholder="e.g. 2500"
                        min="1"
                        required
                    >
                </div>

                <div class="form-group">
                    <label for="location">Location</label>
                    <input
                        type="text"
                        id="location"
                        name="location"
                        placeholder="e.g. Goa, India"
                        required
                    >
                </div>

                <div class="form-group">
                    <label for="image">Property image URL</label>
                    <input
                        type="url"
                        id="image"
                        name="image"
                        placeholder="https://example.com/property.jpg"
                    >
                </div>

                <button type="submit" class="submit-btn">
                    Add Your Home
                </button>

                <p class="note">
                    Please provide accurate property details.
                    Your listing will be submitted to the server.
                </p>

            </form>
        </div>
    </main>

    <footer>
        © 2026 Airbnb-style Home Booking Project
    </footer>

</body>
</html>
