
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Airbnb | Add Your Home</title>

    <script src="https://cdn.tailwindcss.com"></script>
</head>

<body class="m-0 bg-[#f7f7f7] font-sans text-[#222]">

    <!-- Header -->
    <header class="flex items-center justify-between border-b border-gray-200 bg-white px-[7%] py-[22px]">
        <div class="text-[28px] font-bold text-[#ff385c]">
            ⌂ airbnb
        </div>

        <a href="/"
           class="font-bold text-[#222] no-underline hover:text-[#ff385c]">
            Home
        </a>
    </header>

    <!-- Main Content -->
    <main class="mx-auto my-[45px] max-w-[750px] px-5 max-sm:my-[25px]">

        <h1 class="mb-[10px] text-[34px] font-bold max-sm:text-[28px]">
            List your home
        </h1>

        <p class="mb-7 leading-relaxed text-[#717171]">
            Share your space with guests and start hosting.
            Add your property details below.
        </p>

        <!-- Form Card -->
        <div class="rounded-2xl border border-gray-200 bg-white p-8 max-sm:p-[22px]">

            <form action="/host/add-home" method="POST">

                <!-- Property Title -->
                <div class="mb-[22px]">
                    <label for="title"
                           class="mb-[9px] block font-bold">
                        Property title
                    </label>

                    <input
                        type="text"
                        id="title"
                        name="title"
                        placeholder="e.g. Beautiful villa near the beach"
                        required
                        class="w-full rounded-[9px] border border-[#b0b0b0] p-[14px] text-[15px] outline-none focus:border-[#ff385c] focus:ring-1 focus:ring-[#ff385c]"
                    >
                </div>

                <!-- Description -->
                <div class="mb-[22px]">
                    <label for="description"
                           class="mb-[9px] block font-bold">
                        Description
                    </label>

                    <textarea
                        id="description"
                        name="description"
                        placeholder="Describe your home, facilities and nearby attractions..."
                        required
                        class="min-h-[120px] w-full resize-y rounded-[9px] border border-[#b0b0b0] p-[14px] text-[15px] outline-none focus:border-[#ff385c] focus:ring-1 focus:ring-[#ff385c]"
                    ></textarea>
                </div>

                <!-- Price -->
                <div class="mb-[22px]">
                    <label for="price"
                           class="mb-[9px] block font-bold">
                        Price per night (₹)
                    </label>

                    <input
                        type="number"
                        id="price"
                        name="price"
                        placeholder="e.g. 2500"
                        min="1"
                        required
                        class="w-full rounded-[9px] border border-[#b0b0b0] p-[14px] text-[15px] outline-none focus:border-[#ff385c] focus:ring-1 focus:ring-[#ff385c]"
                    >
                </div>

                <!-- Location -->
                <div class="mb-[22px]">
                    <label for="location"
                           class="mb-[9px] block font-bold">
                        Location
                    </label>

                    <input
                        type="text"
                        id="location"
                        name="location"
                        placeholder="e.g. Goa, India"
                        required
                        class="w-full rounded-[9px] border border-[#b0b0b0] p-[14px] text-[15px] outline-none focus:border-[#ff385c] focus:ring-1 focus:ring-[#ff385c]"
                    >
                </div>

                <!-- Property Image -->
                <div class="mb-[22px]">
                    <label for="image"
                           class="mb-[9px] block font-bold">
                        Property image URL
                    </label>

                    <input
                        type="url"
                        id="image"
                        name="image"
                        placeholder="https://example.com/property.jpg"
                        class="w-full rounded-[9px] border border-[#b0b0b0] p-[14px] text-[15px] outline-none focus:border-[#ff385c] focus:ring-1 focus:ring-[#ff385c]"
                    >
                </div>

                <!-- Submit Button -->
                <button
                    type="submit"
                    class="w-full cursor-pointer rounded-[10px] border-0 bg-[#ff385c] p-4 text-[17px] font-bold text-white transition-colors duration-200 hover:bg-[#e31c5f] focus:outline-none focus:ring-2 focus:ring-[#ff385c] focus:ring-offset-2"
                >
                    Add Your Home
                </button>

                <p class="mt-[15px] text-[13px] leading-relaxed text-[#717171]">
                    Please provide accurate property details.
                    Your listing will be submitted to the server.
                </p>

            </form>
        </div>
    </main>

    <!-- Footer -->
    <footer class="px-6 py-[25px] text-center text-[#717171]">
        © 2026 Airbnb-style Home Booking Project
    </footer>

</body>
</html>
