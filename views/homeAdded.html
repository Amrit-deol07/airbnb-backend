
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Home Added Successfully | Airbnb</title>

    <script src="https://cdn.tailwindcss.com"></script>
</head>

<body class="flex min-h-screen flex-col bg-white font-sans text-[#222]">

    <!-- Header -->
    <header class="border-b border-[#eee] px-[7%] py-[22px]">
        <a href="/" class="text-[29px] font-bold text-[#ff385c] no-underline">
            ⌂ airbnb
        </a>
    </header>

    <!-- Main Content -->
    <main class="flex flex-1 items-center justify-center px-5 py-[35px]">

        <!-- Success Card -->
        <section class="w-full max-w-[520px] rounded-[20px] border border-[#eee] px-[35px] py-[45px] text-center shadow-[0_8px_30px_#0000000d] max-[500px]:px-5 max-[500px]:py-[35px]">

            <!-- Success Icon -->
            <div class="mx-auto mb-[25px] flex h-[90px] w-[90px] items-center justify-center rounded-full bg-[#e8f8ed] text-[48px] text-[#16803c]">
                ✓
            </div>

            <h1 class="mb-[15px] text-[30px] font-bold max-[500px]:text-[25px]">
                Home Added Successfully!
            </h1>

            <p class="mb-[30px] text-base leading-[1.7] text-[#717171]">
                Congratulations! Your home details have been
                submitted successfully. Thank you for sharing
                your space with our community.
            </p>

            <!-- Buttons -->
            <div class="flex flex-col gap-[14px]">

                <a
                    href="/"
                    class="block rounded-[10px] bg-[#ff385c] p-[15px] text-base font-bold text-white no-underline transition-colors duration-200 hover:bg-[#e31c5f]"
                >
                    Go to Homepage
                </a>

                <a
                    href="/host/add-home"
                    class="block rounded-[10px] border border-[#222] bg-white p-[15px] text-base font-bold text-[#222] no-underline transition-colors duration-200 hover:bg-[#f7f7f7]"
                >
                    Add Another Home
                </a>

            </div>

        </section>
    </main>

    <!-- Footer -->
    <footer class="border-t border-[#eee] bg-[#f7f7f7] p-[23px] text-center text-sm text-[#717171]">
        © 2026 Airbnb-style Home Booking Project · Help · Privacy · Terms
    </footer>

</body>
</html>
