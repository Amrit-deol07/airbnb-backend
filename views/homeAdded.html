
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Home Added Successfully | Airbnb</title>

    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: Arial, Helvetica, sans-serif;
            background: #fff;
            color: #222;
            min-height: 100vh;
            display: flex;
            flex-direction: column;
        }

        header {
            padding: 22px 7%;
            border-bottom: 1px solid #eee;
        }

        .logo {
            color: #ff385c;
            font-size: 29px;
            font-weight: bold;
            text-decoration: none;
        }

        main {
            flex: 1;
            display: flex;
            justify-content: center;
            align-items: center;
            padding: 35px 20px;
        }

        .success-card {
            width: 100%;
            max-width: 520px;
            text-align: center;
            padding: 45px 35px;
            border: 1px solid #eee;
            border-radius: 20px;
            box-shadow: 0 8px 30px #0000000d;
        }

        .success-icon {
            width: 90px;
            height: 90px;
            background: #e8f8ed;
            color: #16803c;
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 48px;
            margin: 0 auto 25px;
        }

        h1 {
            font-size: 30px;
            margin-bottom: 15px;
        }

        .message {
            color: #717171;
            font-size: 16px;
            line-height: 1.7;
            margin-bottom: 30px;
        }

        .buttons {
            display: flex;
            flex-direction: column;
            gap: 14px;
        }

        .btn {
            display: block;
            text-decoration: none;
            padding: 15px;
            border-radius: 10px;
            font-weight: bold;
            font-size: 16px;
            transition: 0.2s;
        }

        .primary {
            background: #ff385c;
            color: white;
        }

        .primary:hover {
            background: #e31c5f;
        }

        .secondary {
            background: white;
            color: #222;
            border: 1px solid #222;
        }

        .secondary:hover {
            background: #f7f7f7;
        }

        footer {
            padding: 23px;
            background: #f7f7f7;
            border-top: 1px solid #eee;
            color: #717171;
            text-align: center;
            font-size: 14px;
        }

        @media (max-width: 500px) {
            .success-card {
                padding: 35px 20px;
            }

            h1 {
                font-size: 25px;
            }
        }
    </style>
</head>

<body>

    <header>
        <a href="/" class="logo">⌂ airbnb</a>
    </header>

    <main>
        <section class="success-card">

            <div class="success-icon">✓</div>

            <h1>Home Added Successfully!</h1>

            <p class="message">
                Congratulations! Your home details have been
                submitted successfully. Thank you for sharing
                your space with our community.
            </p>

            <div class="buttons">
                <a href="/" class="btn primary">
                    Go to Homepage
                </a>

                <a href="/host/add-home" class="btn secondary">
                    Add Another Home
                </a>
            </div>

        </section>
    </main>

    <footer>
        © 2026 Airbnb-style Home Booking Project · Help · Privacy · Terms
    </footer>

</body>
</html>
